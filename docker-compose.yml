services:
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '51001:8025'

    postgres:
        image: 'postgres:15-alpine'
        working_dir: /home/rija/www/symfony-ecotone
        volumes:
            - '.:/home/rija/www/symfony-ecotone'
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=symfony_ecotone
        ports:
            - '51004:5432'

    webserver:
        image: 'nginx:alpine'
        working_dir: /home/rija/www/symfony-ecotone
        volumes:
            - '.:/home/rija/www/symfony-ecotone'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '51000:80'

    php-fpm:
        build: phpdocker/php-fpm
        working_dir: /home/rija/www/symfony-ecotone
        volumes:
            - '.:/home/rija/www/symfony-ecotone'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/cli/conf.d/99-overrides.ini'

    adminer:
        image: adminer:latest
        ports:
            - '8023:8080'
        links:
            - postgres

    rabbitmq:
        image: rabbitmq:3-management
        ports:
            - "5672:5672"
            - "15672:15672"

