services:
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '8001:8025'

    redis:
        image: 'redis:alpine'

    mysql:
        image: 'mysql:8.0'
        working_dir: /home/rija/www/symfony-ecotone/public
        volumes:
            - '.:/home/rija/www/symfony-ecotone/public'
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_DATABASE=symfony_ecotone
            - MYSQL_USER=rija
            - MYSQL_PASSWORD=secret
        ports:
            - '8002:3306'

    elasticsearch:
        image: 'elasticsearch:6.5.4'

    webserver:
        image: 'nginx:alpine'
        working_dir: /home/rija/www/symfony-ecotone/public
        volumes:
            - '.:/home/rija/www/symfony-ecotone/public'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        environment:
            OTEL_SERVICE_NAME: 'api_service'
        ports:
            - '8000:80'

    php-fpm:
        build: phpdocker/php-fpm
        working_dir: /home/rija/www/symfony-ecotone/public
        volumes:
            - '.:/home/rija/www/symfony-ecotone/public'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/cli/conf.d/99-overrides.ini'
        depends_on:
            - mysql
            - redis
            - rabbitmq


    adminer:
        image: adminer:latest
        ports:
            - '8023:8080'
        links:
            - mysql


    rabbitmq:
        image: rabbitmq:3-management
        ports:
            - "5672:5672"
            - "15672:15672"
